<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RWGroup · Превью редизайнов</title>
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#10161d;--muted:#5d6b78;--line:#dbe1e7;--gold:#9a7b45}
@media(prefers-color-scheme:dark){:root{--bg:#0a0e13;--panel:#111922;--ink:#e9eef3;--muted:#8a99a6;--line:#202c37;--gold:#c2a87a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--bg) 80%,#000));color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding:24px}
.card{max-width:520px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:clamp(24px,5vw,40px);box-shadow:0 30px 70px -40px rgba(0,0,0,.5)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
h1{font-family:Georgia,serif;font-weight:600;font-size:clamp(22px,4vw,30px);line-height:1.12;margin:12px 0 0;letter-spacing:-.01em}
p{color:var(--muted);font-size:15px;line-height:1.6;margin:14px 0 24px}
a.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 20px;border-radius:10px;background:var(--gold);color:#0b1016;text-decoration:none;font-weight:600;font-size:15px;transition:transform .2s ease,filter .2s ease}
a.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
a.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.meta{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.6}
</style>
</head>
<body>
<main class="card">
<span class="eyebrow">RWGroup · Превью</span>
<h1>Редизайн блока «Условия покупки и параметры дома»</h1>
<p>Пять дизайн-направлений одного блока карточки ЖК, каждое на Mobile / Tablet / Desktop. Живой адаптив через CSS container queries.</p>
<a class="btn" href="./conditions/">Открыть превью →</a>
<div class="meta">5 направлений · Данные реальные из карточки ЖК · Тема light + dark</div>
</main>
</body>
</html>
