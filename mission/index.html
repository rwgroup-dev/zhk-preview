/* Инструмент и образец.
   Превью — это бренд заказчика (тёплый крем + золото). Значит оболочка НЕ может быть
   такой же тёплой: иначе блоки перестают читаться как образцы на стенде и сливаются
   с рамой. Поэтому рама берёт УТИЛИТАРНУЮ половину той же дизайн-системы проекта
   (§5 CLAUDE.md: текст #0F172A, вторичный #475569, границы #E2E8F0) — прохладная
   слоистая бумага, — а золото остаётся ровно на одном: на состоянии выбора.
   Гарнитура одна, Manrope: проект определяет ровно одну, и подмешивать сюда вторую
   значило бы врать про бренд в документе, который про этот бренд и есть. Роли
   разведены весом и трекингом (800 дисплей / 400-500 текст / 700 микро-лейбл),
   а системный моноширинный работает только на приборных числах. */
:root{
  --page:#EEF1F5; --card:#FFFFFF; --ink:#0F172A; --muted:#475569; --line:#DFE5EC;
  --gold:#C2A87A; --bronze:#7a6034; --stage:#DCE2EA;
  --shadow:0 24px 70px -45px rgba(15,23,42,.32);
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{--page:#0B1219;--card:#111A23;--ink:#E7EDF3;--muted:#8FA0B1;--line:rgba(231,237,243,.14);
        --bronze:#D9BE8E;--stage:#070C11;--shadow:0 30px 80px -50px rgba(0,0,0,.9)}
}
:root[data-theme="light"]{--page:#EEF1F5;--card:#FFFFFF;--ink:#0F172A;--muted:#475569;--line:#DFE5EC;--bronze:#7a6034;--stage:#DCE2EA;--shadow:0 24px 70px -45px rgba(15,23,42,.32)}
:root[data-theme="dark"]{--page:#0B1219;--card:#111A23;--ink:#E7EDF3;--muted:#8FA0B1;--line:rgba(231,237,243,.14);--bronze:#D9BE8E;--stage:#070C11;--shadow:0 30px 80px -50px rgba(0,0,0,.9)}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:Manrope,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.shell{max-width:1520px;margin:0 auto;padding:0 20px 72px}

.head{padding:56px 0 28px;max-width:760px}
.kicker{display:inline-flex;align-items:center;gap:10px;font-size:11px;font-weight:700;letter-spacing:.22em;
  text-transform:uppercase;color:var(--bronze)}
.kicker::before{content:'';width:26px;height:1px;background:var(--gold)}
h1{margin:16px 0 0;font-size:clamp(30px,3.4vw,46px);line-height:1.06;letter-spacing:-.022em;font-weight:800}
#intro{margin:16px 0 0;max-width:62ch;font-size:17px;line-height:1.6;color:var(--muted);text-wrap:pretty}

.bar{position:sticky;top:0;z-index:30;margin:0 -20px;padding:10px 20px 12px;
  background:color-mix(in srgb, var(--page) 86%, transparent);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
/* Вкладок больше, чем влезает в экран — правый край растворяется, чтобы список
   читался как прокручиваемый, а не как обрезанный. */
#tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent);
  mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent)}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:inline-flex;align-items:center;gap:9px;padding:9px 14px 9px 9px;min-height:44px;
  border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);
  font:inherit;font-size:14px;cursor:pointer;transition:border-color .18s,transform .18s,box-shadow .18s}
.tab:hover{border-color:color-mix(in srgb,var(--gold) 60%,transparent);transform:translateY(-1px)}
.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tab-chip{display:grid;place-items:center;width:26px;height:26px;border-radius:999px;flex:0 0 auto;
  background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--bronze);font-size:12px;font-weight:800;letter-spacing:.02em}
.tab-now .tab-chip{width:auto;padding:0 10px;border-radius:999px;background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:600}
.tab-name{white-space:nowrap}
.tab .star{font-style:normal;color:var(--gold);font-size:12px}
.tab[aria-selected="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 45%,transparent)}

.ctl-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.segs{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:12px;background:var(--card);gap:2px;
  max-width:100%;overflow-x:auto;scrollbar-width:none}
.segs::-webkit-scrollbar{display:none}

.seg:hover{color:var(--ink)}

.v-g{
  --ink:#030A0F;
  --gold:#C2A87A;
  --gold-lit:#D8C39A;
  --warm:#F2EBDF;
  --cool:#A8B3BB;
  --rail:20px;
}

/* \u2500\u2500 frame \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
/* The frame keeps a minimum widescreen proportion even when the owner leaves one line,
   and centres what little there is inside it \u2014 a short block is still a shot. */
.v-g .sec{position:relative;overflow:hidden;isolation:isolate;background:var(--ink);
  padding:248px 0 64px;min-height:400px;display:flex;flex-direction:column;justify-content:center}
.v-g .sec::before{
  content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(120% 90% at 100% -10%, color-mix(in srgb, var(--gold) 13%, transparent), transparent 55%),
    radial-gradient(90% 80% at -10% 110%, rgba(14,165,233,0.05), transparent 60%);
}
.v-g .bar{position:absolute;left:0;right:0;height:10px;z-index:3;background:var(--ink);pointer-events:none}
.v-g .bar-top{top:0;box-shadow:0 1px 0 color-mix(in srgb, var(--gold) 24%, transparent)}
.v-g .bar-bot{bottom:0;box-shadow:0 -1px 0 color-mix(in srgb, var(--gold) 24%, transparent)}

/* \u2500\u2500 the still \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.v-g .still{position:absolute;left:0;right:0;top:0;height:452px;z-index:0}
.v-g .still img{width:100%;height:100%;object-fit:cover;object-position:64% 14%}
.v-g .veil,.v-g .grade,.v-g .grain{position:absolute;inset:0;pointer-events:none}
.v-g .veil{
  background:linear-gradient(180deg,
    rgba(3,10,15,.26) 0px,
    rgba(3,10,15,.40) 92px,
    rgba(3,10,15,.72) 166px,
    rgba(3,10,15,.945) 212px,
    rgba(3,10,15,.986) 258px,
    rgba(3,10,15,.996) 330px,
    rgba(3,10,15,.998) 100%);
}
.v-g .grade{
  background:
    radial-gradient(125% 115% at 62% 30%, transparent 24%, rgba(3,10,15,.62) 100%),
    linear-gradient(180deg, rgba(3,10,15,.55), rgba(3,10,15,0) 120px);
}
.v-g .grain{
  opacity:.55;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 1px, rgba(0,0,0,.022) 1px 2px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.014) 0 1px, rgba(0,0,0,.014) 1px 3px);
}

/* \u2500\u2500 stage \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
/* width:100% is load-bearing \u2014 as a flex item, an auto side margin would otherwise
   shrink-wrap the stage and float the column into the middle of the frame. */
.v-g .stage{position:relative;z-index:4;width:100%;padding:0 26px}
.v-g .col{position:relative;max-width:600px}

.v-g .axis{position:absolute;left:calc(-1 * var(--rail));top:4px;bottom:2px;width:1px;transform-origin:top;
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--gold) 62%, transparent) 0%,
    color-mix(in srgb, var(--gold) 30%, transparent) 26%,
    color-mix(in srgb, var(--gold) 19%, transparent) 62%,
    color-mix(in srgb, var(--gold) 15%, transparent) 94%,
    transparent 100%);
}
.v-g .cue{position:absolute;left:-2px;top:0;width:5px;height:5px;border-radius:1px;background:var(--gold-lit);
  box-shadow:0 0 14px color-mix(in srgb, var(--gold) 70%, transparent)}

.v-g .label{
  display:block;margin:0 0 20px;font-size:12px;font-weight:700;line-height:1.2;
  text-transform:uppercase;letter-spacing:.3em;color:var(--gold-lit);
}
.v-g .stmt{
  margin:0;font-size:23px;font-weight:300;line-height:1.4;letter-spacing:-.012em;
  color:var(--warm);text-wrap:balance;
}
.v-g .body{margin:26px 0 0;display:flex;flex-direction:column;gap:15px}
.v-g .body p{font-size:16px;font-weight:400;line-height:1.72;color:var(--cool);text-wrap:pretty}
.v-g .body p:first-child{color:#C0C9CF}

/* \u2500\u2500 film strip \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.v-g .reel{
  position:relative;margin:38px 0 0;width:max-content;max-width:100%;
  display:flex;gap:5px;padding:10px;border-radius:3px;
  background:linear-gradient(180deg, #071119, #040C12);
  box-shadow:0 22px 44px -26px rgba(0,0,0,.95), inset 0 0 0 1px color-mix(in srgb, var(--gold) 15%, transparent);
}
.v-g .perf{position:absolute;left:10px;right:10px;height:3px;border-radius:2px;
  background:repeating-linear-gradient(90deg, color-mix(in srgb, var(--gold) 34%, transparent) 0 5px, transparent 5px 14px)}
.v-g .perf-t{top:3.5px}
.v-g .perf-b{bottom:3.5px}
.v-g .cell{
  margin:0;flex:0 1 84px;min-width:0;aspect-ratio:3/4;overflow:hidden;border-radius:2px;position:relative;
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--gold) 26%, transparent);
}
.v-g .cell img{width:100%;height:100%;object-fit:cover;object-position:50% 16%;
  filter:grayscale(.3) contrast(1.06) saturate(.88) brightness(.94)}
.v-g .cell::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(3,10,15,0) 45%, rgba(3,10,15,.55) 100%)}

/* \u2500\u2500 tablet \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
@media (min-width:600px){
  .v-g .sec{padding:300px 0 82px}
  .v-g .still{height:520px}
  .v-g .veil{background:linear-gradient(180deg,
    rgba(3,10,15,.24) 0px,
    rgba(3,10,15,.38) 120px,

    rgba(3,10,15,.996) 390px,
    rgba(3,10,15,.998) 100%)}
  .v-g .stage{padding:0 48px}
  .v-g{--rail:26px}
  .v-g .col{max-width:560px}
  .v-g .label{font-size:13px;margin-bottom:24px}
  .v-g .stmt{font-size:29px;line-height:1.34}
  .v-g .body{margin-top:30px;gap:16px}
  .v-g .body p{font-size:17px}
  .v-g .cell{flex-basis:104px}
  .v-g .reel{margin-top:44px}
}

/* \u2500\u2500 cinemascope: photo becomes the right panel \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
@media (min-width:1100px){
